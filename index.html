<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pickleball Score Keeper</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root {
    --bg: #0f1720;
    --panel: #1a2634;
    --panel-2: #223142;
    --text: #eef4f8;
    --muted: #8fa3b5;
    --teamA: #0fb9a6;
    --teamA-dim: #0a7d72;
    --teamB: #f4b740;
    --teamB-dim: #b57f14;
    --danger: #e2604f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app { height: 100%; height: 100dvh; display: flex; flex-direction: column; }

  /* ---------- Setup screen ---------- */
  .setup {
    height: 100%;
    overflow-y: auto;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .setup h1 { font-size: 26px; text-align: center; margin-bottom: 4px; }
  .setup h1 .title-icon { height: 26px; vertical-align: -4px; border-radius: 7px; }
  .setup .sub { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 20px; }
  .team-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 560px; margin: 0 auto; }
  @media (max-width: 420px) { .team-cards { grid-template-columns: 1fr; } }
  .team-card { background: var(--panel); border-radius: 14px; padding: 14px; border-top: 4px solid var(--teamA); }
  .team-card.b { border-top-color: var(--teamB); }
  .team-card label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .team-card input {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #33465b;
    background: var(--panel-2); color: var(--text); font-size: 16px;
    min-height: 44px; /* Apple HIG minimum tap target */
  }
  .team-card input:focus { outline: 2px solid var(--teamA); border-color: transparent; }
  .team-card.b input:focus { outline-color: var(--teamB); }
  .start-btn {
    display: block; width: 100%; max-width: 560px; margin: 20px auto 0; padding: 16px;
    font-size: 18px; font-weight: 700; color: #06231f; background: var(--teamA);
    border: none; border-radius: 12px; cursor: pointer;
  }
  .rules-note { max-width: 560px; margin: 16px auto 0; color: var(--muted); font-size: 14px; line-height: 1.6; text-align: center; }

  /* ---------- Game screen ---------- */
  .topbar {
    padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    text-align: center; background: var(--panel);
  }
  .topbar .round-line { font-size: 18px; font-weight: 700; }
  .topbar .rally-line { font-size: 15px; color: var(--muted); margin-top: 3px; }
  .zones { flex: 1; display: flex; min-height: 0; position: relative; }
  .zone {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; gap: 6px; padding: 12px;
  }
  .zone.a { background: linear-gradient(180deg, #12312e, #0e2522); }
  .zone.b { background: linear-gradient(180deg, #33290f, #241d0b); }
  .zones .zone:first-of-type { padding-left: max(12px, env(safe-area-inset-left)); }
  .zones .zone:last-of-type { padding-right: max(12px, env(safe-area-inset-right)); }
  .zone:active.a { background: #174540; }
  .zone:active.b { background: #453913; }
  .zone .tname { font-size: 19px; font-weight: 700; letter-spacing: 0.3px; }
  .zone.a .tname { color: var(--teamA); }
  .zone.b .tname { color: var(--teamB); }
  .serve-pill {
    font-size: 13px; font-weight: 700; letter-spacing: 1.5px; padding: 5px 14px;
    border-radius: 999px; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .serve-pill.hidden { visibility: hidden; }
  .zone.a .serve-pill { background: var(--teamA); color: #06231f; }
  .zone.b .serve-pill { background: var(--teamB); color: #2b1f04; }
  .zone .score { font-size: clamp(72px, 24vw, 160px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .zone .pname { font-size: 17px; color: var(--muted); }
  .zone .hint { position: absolute; bottom: 12px; font-size: 13px; color: var(--muted); opacity: 0.8; padding: 0 8px; text-align: center; }
  .swap-btn {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid #33465b;
    background: var(--panel); color: var(--muted); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .swap-btn:active { background: var(--panel-2); color: var(--text); }
  .bottombar {
    display: flex; gap: 10px;
    padding: 10px max(12px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background: var(--panel);
  }
  .bottombar button {
    flex: 1; padding: 14px; font-size: 17px; font-weight: 600; border: none; border-radius: 10px;
    background: var(--panel-2); color: var(--text); cursor: pointer;
  }
  .bottombar button:disabled { opacity: 0.35; cursor: default; }
  .bottombar button.danger { color: var(--danger); }

  /* ---------- Overlay (interstitial / winner) ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(8, 13, 19, 0.92); z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; text-align: center; backdrop-filter: blur(4px);
    overflow-y: auto;
  }
  /* center when content fits, scroll from the top when it doesn't */
  .overlay::before, .overlay::after { content: ''; margin: auto; }
  .overlay > * { flex-shrink: 0; }
  .ball { vertical-align: -2px; flex-shrink: 0; }
  .itl { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 380px; }
  .itl-status { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 7px; max-width: 100%;
    background: rgba(238, 244, 248, 0.05); border: 1px solid rgba(238, 244, 248, 0.12);
    border-radius: 16px; padding: 6px 14px; color: #a9bccb;
    font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .eyebrow.gold { background: rgba(244, 183, 64, 0.1); border-color: rgba(244, 183, 64, 0.3); color: var(--teamB); }
  .scoreboard { display: flex; align-items: center; justify-content: center; gap: 20px; }
  .scoreboard .lbl { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .scoreboard .lbl.a { color: var(--teamA); }
  .scoreboard .lbl.b { color: var(--teamB); }
  .scoreboard .num { font-size: 48px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .scoreboard .trail .num { color: rgba(238, 244, 248, 0.65); }
  .scoreboard .dash { font-size: 20px; color: var(--muted); }
  .progress { width: 76%; max-width: 260px; }
  .progress .segs { display: flex; gap: 3px; }
  .progress .seg { flex: 1; height: 4px; border-radius: 2px; background: #1d2b3a; }
  .progress .seg.done { background: #93a7b8; }
  .progress .seg.next { background: rgba(238, 244, 248, 0.38); }
  .progress .cap { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .itl-card { background: var(--panel); border: 1px solid rgba(51, 70, 91, 0.55); border-radius: 16px; padding: 16px; }
  .itl-card .chiprow { display: flex; align-items: center; justify-content: space-between; }
  .itl-card .chip {
    background: var(--panel-2); border-radius: 999px; padding: 4px 10px; color: #c7d5e0;
    font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .itl-card .chip.gold { background: rgba(244, 183, 64, 0.14); color: var(--teamB); }
  .itl-card .meta { font-size: 14px; color: var(--muted); }
  .itl-card .vs { margin: 14px 0 4px; }
  .itl-card .vs .p { font-size: 26px; font-weight: 800; }
  .itl-card .vs .p.a { color: var(--teamA); }
  .itl-card .vs .p.b { color: var(--teamB); }
  .itl-card .vs .v { font-size: 14px; color: var(--muted); margin: 0 10px; }
  .itl-card .alloc { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .serve-static { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 16px; }
  .serve-static b.a { color: var(--teamA); }
  .serve-static b.b { color: var(--teamB); }
  .serve-static .why { color: var(--muted); }
  .serve-pick { display: flex; align-items: center; gap: 10px; }
  .serve-pick .lbl { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .serve-pick .svc { flex: 1; display: flex; gap: 3px; background: #16202c; border: 1px solid #33465b; border-radius: 12px; padding: 3px; }
  .serve-pick .svc button {
    flex: 1; height: 44px; border: none; border-radius: 9px; background: none; cursor: pointer;
    font-size: 15px; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .serve-pick .svc button.on { font-weight: 700; }
  .serve-pick .svc button.on.a { background: rgba(15, 185, 166, 0.16); color: var(--teamA); }
  .serve-pick .svc button.on.b { background: rgba(244, 183, 64, 0.16); color: var(--teamB); }
  .serve-cap { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .itl-actions { display: flex; flex-direction: column; gap: 10px; }
  .itl-primary {
    order: -1; width: 100%; height: 50px; font-size: 17px; font-weight: 700;
    border: none; border-radius: 12px; background: var(--teamA); color: #06231f; cursor: pointer;
  }
  .itl-secondary { display: flex; gap: 10px; }
  .itl-ghost {
    flex: 1; height: 44px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: none; border: 1px solid rgba(238, 244, 248, 0.28); border-radius: 10px; color: #cbd8e4;
  }
  .itl-ghost:disabled { opacity: 0.35; cursor: default; }
  .win { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 340px; }
  .win .itl-actions { width: 100%; margin-top: 10px; }
  .overlay .scoreline { font-size: 17px; color: var(--muted); }
  .overlay .scoreline b { color: var(--text); font-size: 21px; }
  .overlay .trophy { font-size: 60px; }
  .overlay .win-team { font-size: 34px; font-weight: 800; }

  /* ---------- Short viewports (phones in landscape) ---------- */
  @media (max-height: 480px) {
    .topbar { padding-top: calc(4px + env(safe-area-inset-top)); padding-bottom: 4px; }
    .topbar .round-line { display: inline; font-size: 15px; }
    .topbar .rally-line { display: inline; font-size: 14px; }
    .topbar .rally-line::before { content: ' · '; }
    .zone { gap: 4px; padding-top: 6px; padding-bottom: 6px; }
    .zone .tname { font-size: 16px; }
    .zone .serve-pill { font-size: 11px; padding: 3px 10px; letter-spacing: 1px; }
    .zone .score { font-size: clamp(40px, 32vh, 140px); }
    .zone .pname { display: none; }
    .zone .hint { position: static; font-size: 13px; }
    .bottombar { gap: 8px; padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
    .bottombar button { padding: 9px; font-size: 15px; }
    .overlay { padding: 12px 20px; }
    .itl { display: grid; grid-template-columns: 40% 1fr; gap: 12px; max-width: 640px; align-items: center; }
    .itl-status { gap: 10px; }
    .eyebrow { font-size: 12px; padding: 5px 12px; }
    .scoreboard { gap: 16px; }
    .scoreboard .num { font-size: 36px; }
    .scoreboard .lbl { font-size: 12px; }
    .progress .cap { font-size: 12px; margin-top: 5px; }
    .itl-card { padding: 12px 14px; }
    .itl-card .vs { margin: 9px 0 2px; }
    .itl-card .vs .p { font-size: 22px; }
    .itl-card .alloc { font-size: 13px; margin-bottom: 9px; }
    .itl-card .meta { font-size: 13px; }
    .serve-static { font-size: 15px; }
    .serve-pick .svc button { height: 40px; font-size: 14px; }
    .serve-cap { font-size: 12px; margin-top: 6px; }
    .itl > .itl-actions { grid-column: 1 / -1; display: grid; grid-template-columns: 40% 1fr; gap: 12px; }
    .itl .itl-primary { order: 1; height: 44px; font-size: 16px; }
    .itl .itl-ghost { height: 44px; font-size: 14px; }
    .overlay .trophy { font-size: 40px; }
    .overlay .win-team { font-size: 26px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ===== Rules ===== */
const ROUND_RALLIES = [8, 6, 4];   // rallies per matchup in rounds 1-3
const TARGET = 33;                  // points to win
const WIN_BY = 2;                   // 36-36 after all rounds -> golden point
const SEEDS = 4;
const STORE_KEY = 'pb-4v4-state-v1';

/* ===== State ===== */
function freshState(teams) {
  return {
    phase: 'between',        // 'setup' | 'between' | 'play' | 'done'
    teams,                   // [{name, players:[4]}, {name, players:[4]}]
    scores: [0, 0],
    round: 0,                // 0..2
    matchup: 0,              // seed index 0..3
    rallies: 0,              // rallies played in current matchup
    server: 0,               // team serving next rally (winner of last rally)
    swapped: false,          // true = team B on the left side of the screen
    overtime: false,         // golden point at 36-36 after all rounds
    note: 'Game on!',
    hist: []
  };
}
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const st = JSON.parse(raw);
      if (st.server === undefined) st.server = 0;      // migrate pre-serve-tracking saves
      if (st.overtime === undefined) st.overtime = false;
      if (st.swapped === undefined) st.swapped = false;
      return st;
    }
  } catch (e) {}
  return { phase: 'setup', teams: defaultTeams() };
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
}
function defaultTeams() {
  return [
    { name: '', players: ['', '', '', ''] },
    { name: '', players: ['', '', '', ''] }
  ];
}

/* ===== Game logic ===== */
function snapshot() {
  S.hist.push(JSON.stringify({
    phase: S.phase, scores: S.scores, round: S.round, matchup: S.matchup,
    rallies: S.rallies, server: S.server, overtime: S.overtime, note: S.note
  }));
  if (S.hist.length > 300) S.hist.shift();
}

function undo() {
  const prev = S.hist.pop();
  if (!prev) return;
  Object.assign(S, JSON.parse(prev));
  render();
}

function hasWinner() {
  const [a, b] = S.scores;
  // Golden point: at 36-36 after all rounds, the next rally wins outright.
  const winBy = S.overtime ? 1 : WIN_BY;
  if (a >= TARGET && a - b >= winBy) return 0;
  if (b >= TARGET && b - a >= winBy) return 1;
  return null;
}

function point(team) {
  if (S.phase !== 'play') return;
  snapshot();
  S.scores[team]++;
  S.rallies++;
  S.server = team; // rally winner serves next

  if (hasWinner() !== null) {
    S.phase = 'done';
    render();
    return;
  }

  // Golden point has no rally allocation — a single rally decides it.
  if (!S.overtime && S.rallies >= ROUND_RALLIES[S.round]) {
    advanceMatchup();
  }
  render();
}

function advanceMatchup() {
  const finishedSeed = S.matchup + 1;
  S.rallies = 0;
  S.matchup++;
  if (S.matchup >= SEEDS) {
    S.matchup = 0;
    S.round++;
  }
  if (S.round >= ROUND_RALLIES.length) {
    // All 3 rounds done, 36-36 — seed 4 pair plays a single golden point.
    S.overtime = true;
    S.round = ROUND_RALLIES.length - 1;
    S.matchup = SEEDS - 1;
    S.note = 'All square!';
  } else if (S.matchup === 0) {
    S.note = `Seed ${finishedSeed} matchup complete — that wraps Round ${S.round}!`;
  } else {
    S.note = `Seed ${finishedSeed} matchup complete!`;
  }
  S.phase = 'between';
}

function startGameFromSetup() {
  const teams = [0, 1].map(t => ({
    name: val(`tname${t}`) || (t === 0 ? 'Team A' : 'Team B'),
    players: [0, 1, 2, 3].map(p => val(`p${t}_${p}`) || `${t === 0 ? 'A' : 'B'}${p + 1}`)
  }));
  S = freshState(teams);
  render();
}
function val(id) { return (document.getElementById(id)?.value || '').trim(); }

/* Display preference only — deliberately not snapshotted, so undo never flips sides. */
function swapSides() {
  S.swapped = !S.swapped;
  render();
}

function restart(keepTeams) {
  if (!confirm(keepTeams ? 'Restart the game with the same teams?' : 'Start over with new teams?')) return;
  S = keepTeams ? freshState(S.teams) : { phase: 'setup', teams: S.teams };
  render();
}

/* ===== Rendering ===== */
const app = document.getElementById('app');
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BALL = s => `<svg class="ball" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#cbdc46"/><g fill="#7c8f1f"><circle cx="12" cy="7" r="1.7"/><circle cx="8" cy="11.5" r="1.7"/><circle cx="16" cy="11.5" r="1.7"/><circle cx="10" cy="16" r="1.7"/><circle cx="14.5" cy="16" r="1.7"/></g></svg>`;

function render() {
  save();
  if (S.phase === 'setup') renderSetup();
  else renderGame();
}

function renderSetup() {
  const t = S.teams;
  const card = (ti, cls, label) => `
    <div class="team-card ${cls}">
      <label>${label} name</label>
      <input id="tname${ti}" placeholder="${label}" value="${esc(t[ti].name)}" autocomplete="off">
      ${[0, 1, 2, 3].map(p => `
        <label>Seed ${p + 1}</label>
        <input id="p${ti}_${p}" placeholder="Player ${p + 1}" value="${esc(t[ti].players[p])}" autocomplete="off">
      `).join('')}
    </div>`;
  app.innerHTML = `
    <div class="setup">
      <h1><img src="./icon.svg" class="title-icon" alt=""> 4v4 Team Singles</h1>
      <div class="sub">Rally scoring · First to ${TARGET}, win by ${WIN_BY}</div>
      <div class="team-cards">
        ${card(0, 'a', 'Team A')}
        ${card(1, 'b', 'Team B')}
      </div>
      <button class="start-btn" onclick="startGameFromSetup()">Start Game</button>
      <div class="rules-note">
        3 rounds &middot; seeds play their counterparts each round<br>
        Round 1: 8 rallies per matchup &middot; Round 2: 6 &middot; Round 3: 4<br>
        Team scores carry over between rounds
      </div>
    </div>`;
}

function sideOrder() { return S.swapped ? [1, 0] : [0, 1]; }

function zoneHTML(t) {
  const p = S.teams[t].players[S.matchup];
  return `
      <div class="zone ${t === 0 ? 'a' : 'b'}" onpointerdown="point(${t})">
        <div class="tname">${esc(S.teams[t].name)}</div>
        <div class="serve-pill ${S.server === t ? '' : 'hidden'}">${BALL(14)} Serving</div>
        <div class="score">${S.scores[t]}</div>
        <div class="pname">${esc(p)} on court</div>
        <div class="hint">tap when ${esc(p)} wins the rally</div>
      </div>`;
}

function renderGame() {
  const seed = S.matchup;
  const [L, R] = sideOrder();
  const alloc = ROUND_RALLIES[S.round];
  const roundLabel = S.overtime ? 'Golden Point' : `Round ${S.round + 1} of 3`;
  const rallyLabel = S.overtime
    ? `Seed ${seed + 1} matchup · next rally wins it all`
    : `Seed ${seed + 1} matchup · Rally ${Math.min(S.rallies + 1, alloc)} of ${alloc}`;

  app.innerHTML = `
    <div class="topbar">
      <div class="round-line">${roundLabel}</div>
      <div class="rally-line">${rallyLabel}</div>
    </div>
    <div class="zones">
      ${zoneHTML(L)}
      ${zoneHTML(R)}
      <button class="swap-btn" onclick="swapSides()" title="Swap sides" aria-label="Swap sides">⇄</button>
    </div>
    <div class="bottombar">
      <button onclick="undo()" ${S.hist.length ? '' : 'disabled'}>↩︎ Undo</button>
      <button class="danger" onclick="restart(true)">Restart</button>
      <button onclick="restart(false)">New Teams</button>
    </div>
    ${S.phase === 'between' ? interstitial() : ''}
    ${S.phase === 'done' ? winnerOverlay() : ''}`;
}

function interstitial() {
  const seed = S.matchup;
  const [L, R] = sideOrder();
  const pL = S.teams[L].players[seed];
  const pR = S.teams[R].players[seed];
  const cls = t => t === 0 ? 'a' : 'b';
  const alloc = ROUND_RALLIES[S.round];
  const done = S.round * SEEDS + S.matchup;
  const total = ROUND_RALLIES.length * SEEDS;
  const atStart = S.scores[0] + S.scores[1] === 0;
  const srv = S.server;

  const side = t => `
        <div class="${S.scores[t] < S.scores[1 - t] ? 'trail' : ''}">
          <div class="lbl ${cls(t)}">${esc(S.teams[t].name)}</div>
          <div class="num">${S.scores[t]}</div>
        </div>`;
  const progress = S.overtime ? '' : `
        <div class="progress">
          <div class="segs">${Array.from({ length: total }, (_, i) =>
            `<div class="seg ${i < done ? 'done' : i === done ? 'next' : ''}"></div>`).join('')}</div>
          <div class="cap">Matchup ${done + 1} of ${total}</div>
        </div>`;
  // Serve is only a choice before the game's first rally; afterwards the rally winner serves.
  const serveArea = atStart ? `
        <div class="serve-pick">
          <span class="lbl">First serve</span>
          <div class="svc">
            <button class="${srv === L ? `on ${cls(L)}` : ''}" onclick="S.server=${L};render()">${srv === L ? BALL(14) : ''}${esc(pL)}</button>
            <button class="${srv === R ? `on ${cls(R)}` : ''}" onclick="S.server=${R};render()">${srv === R ? BALL(14) : ''}${esc(pR)}</button>
          </div>
        </div>
        <div class="serve-cap">tap a name to choose the opening server</div>` : `
        <div class="serve-static">${BALL(15)}<span><b class="${cls(srv)}">${esc(S.teams[srv].players[seed])}</b> serves first <span class="why">· won the last rally</span></span></div>`;

  return `
    <div class="overlay">
      <div class="itl">
        <div class="itl-status">
          <div class="eyebrow${S.overtime ? ' gold' : ''}">${S.overtime ? '⚡' : atStart ? BALL(13) : '✓'} ${esc(S.note)}</div>
          <div class="scoreboard">${side(L)}<div class="dash">—</div>${side(R)}</div>
          ${progress}
        </div>
        <div class="itl-card">
          <div class="chiprow">
            <span class="chip${S.overtime ? ' gold' : ''}">${S.overtime ? 'Golden point' : 'Up next'}</span>
            <span class="meta">${S.overtime ? `Seed ${seed + 1}` : `Round ${S.round + 1} · Seed ${seed + 1}`}</span>
          </div>
          <div class="vs"><span class="p ${cls(L)}">${esc(pL)}</span><span class="v">vs</span><span class="p ${cls(R)}">${esc(pR)}</span></div>
          <div class="alloc">${S.overtime ? 'Sudden death — one rally wins it all' : `${alloc} rallies this matchup`}</div>
          ${serveArea}
        </div>
        <div class="itl-actions">
          <div class="itl-secondary">
            <button class="itl-ghost" onclick="swapSides()">⇄ Swap sides</button>
            <button class="itl-ghost" onclick="undo()" ${S.hist.length ? '' : 'disabled'}>↩︎ Undo rally</button>
          </div>
          <button class="itl-primary" onclick="S.phase='play';render()">${S.overtime ? 'Play golden point' : 'Start Rallies'}</button>
        </div>
      </div>
    </div>`;
}

function winnerOverlay() {
  const w = hasWinner();
  const [L, R] = sideOrder();
  return `
    <div class="overlay">
      <div class="win">
        <div class="trophy">🏆</div>
        <div class="win-team" style="color:${w === 0 ? 'var(--teamA)' : 'var(--teamB)'}">${esc(S.teams[w].name)} wins!</div>
        <div class="scoreline"><b>${S.scores[L]}</b> — <b>${S.scores[R]}</b></div>
        <div class="itl-actions">
          <div class="itl-secondary">
            <button class="itl-ghost" onclick="restart(false)">New Teams</button>
            <button class="itl-ghost" onclick="undo()">↩︎ Undo rally</button>
          </div>
          <button class="itl-primary" onclick="restart(true)">Rematch</button>
        </div>
      </div>
    </div>`;
}

/* ===== Keep screen awake during play ===== */
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});
document.addEventListener('pointerdown', keepAwake, { once: true });

/* ===== PWA ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
