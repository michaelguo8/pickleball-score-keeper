<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pickleball Score Keeper</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root {
    --bg: #0f1720;
    --panel: #1a2634;
    --panel-2: #223142;
    --text: #eef4f8;
    --muted: #8fa3b5;
    --teamA: #0fb9a6;
    --teamA-dim: #0a7d72;
    --teamB: #f4b740;
    --teamB-dim: #b57f14;
    --danger: #e2604f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app { height: 100%; height: 100dvh; display: flex; flex-direction: column; }

  /* ---------- Setup screen ---------- */
  .setup {
    height: 100%;
    overflow-y: auto;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .setup h1 { font-size: 32px; text-align: center; margin-bottom: 6px; }
  .setup h1 .title-icon { height: 32px; vertical-align: -5px; border-radius: 8px; }
  .setup .sub { text-align: center; color: var(--muted); font-size: 18px; margin-bottom: 22px; }
  .team-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 560px; margin: 0 auto; }
  @media (max-width: 420px) { .team-cards { grid-template-columns: 1fr; } }
  .team-card { background: var(--panel); border-radius: 14px; padding: 14px; border-top: 4px solid var(--teamA); }
  .team-card.b { border-top-color: var(--teamB); }
  .team-card label { display: block; font-size: 15px; color: var(--muted); margin: 14px 0 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  .team-card input {
    width: 100%; padding: 13px 14px; border-radius: 9px; border: 1px solid #33465b;
    background: var(--panel-2); color: var(--text); font-size: 18px;
    min-height: 50px;
  }
  .team-card input:focus { outline: 2px solid var(--teamA); border-color: transparent; }
  .team-card.b input:focus { outline-color: var(--teamB); }
  .start-btn {
    display: block; width: 100%; max-width: 560px; margin: 22px auto 0; padding: 18px;
    font-size: 21px; font-weight: 700; color: #06231f; background: var(--teamA);
    border: none; border-radius: 12px; cursor: pointer;
  }
  .rules-note { max-width: 560px; margin: 18px auto 0; color: var(--muted); font-size: 16px; line-height: 1.65; text-align: center; }

  /* ---------- Game screen ---------- */
  .topbar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px;
    padding: calc(8px + env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
    text-align: center; background: var(--panel);
  }
  .tb-side { display: flex; gap: 7px; justify-self: start; }
  .tb-side.right { justify-self: end; }
  .tb-btn {
    width: 44px; height: 44px; border: none; border-radius: 10px; cursor: pointer;
    background: var(--panel-2); color: var(--text); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .tb-btn:disabled { opacity: 0.35; cursor: default; }
  .tb-center { min-width: 0; }
  .topbar .round-line { font-size: 22px; font-weight: 700; }
  .topbar .rally-line { font-size: 17px; color: var(--muted); margin-top: 4px; }
  .zones { flex: 1; display: flex; min-height: 0; position: relative; }
  .zone {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; gap: 6px; padding: 12px;
  }
  .zone.a { background: linear-gradient(180deg, #12312e, #0e2522); }
  .zone.b { background: linear-gradient(180deg, #33290f, #241d0b); }
  .zones .zone:first-of-type { padding-left: max(12px, env(safe-area-inset-left)); }
  .zones .zone:last-of-type { padding-right: max(12px, env(safe-area-inset-right)); }
  .zone:active.a { background: #174540; }
  .zone:active.b { background: #453913; }
  .zone .tname { font-size: 23px; font-weight: 700; letter-spacing: 0.3px; }
  .zone.a .tname { color: var(--teamA); }
  .zone.b .tname { color: var(--teamB); }
  .serve-pill {
    font-size: 15px; font-weight: 700; letter-spacing: 1.5px; padding: 6px 15px;
    border-radius: 999px; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .serve-pill.hidden { visibility: hidden; }
  .zone.a .serve-pill { background: var(--teamA); color: #06231f; }
  .zone.b .serve-pill { background: var(--teamB); color: #2b1f04; }
  .zone .score { font-size: clamp(72px, 24vw, 160px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .zone .pname { font-size: 20px; color: var(--muted); }
  .zone .hint { position: absolute; bottom: calc(12px + env(safe-area-inset-bottom)); font-size: 16px; color: var(--muted); opacity: 0.8; padding: 0 8px; text-align: center; }
  .menu-backdrop { position: fixed; inset: 0; z-index: 19; }
  .menu {
    position: fixed; z-index: 20;
    top: calc(64px + env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    background: var(--panel); border: 1px solid #33465b; border-radius: 12px; padding: 6px;
    display: flex; flex-direction: column; min-width: 190px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
  .menu button {
    text-align: left; padding: 14px 16px; font-size: 18px; font-weight: 600;
    background: none; border: none; border-radius: 8px; color: var(--text); cursor: pointer;
  }
  .menu button:active { background: var(--panel-2); }
  .menu button.danger { color: var(--danger); }
  .menu-sep { height: 1px; background: #33465b; margin: 5px 8px; }

  /* ---------- Overlay (interstitial / winner) ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(8, 13, 19, 0.92); z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; text-align: center; backdrop-filter: blur(4px);
    overflow-y: auto;
  }
  /* center when content fits, scroll from the top when it doesn't */
  .overlay::before, .overlay::after { content: ''; margin: auto; }
  .overlay > * { flex-shrink: 0; }
  .ball { vertical-align: -2px; flex-shrink: 0; }
  .itl { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 380px; }
  .itl-status { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
    background: rgba(238, 244, 248, 0.05); border: 1px solid rgba(238, 244, 248, 0.12);
    border-radius: 18px; padding: 8px 16px; color: #a9bccb;
    font-size: 15px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  }
  .eyebrow.gold { background: rgba(244, 183, 64, 0.1); border-color: rgba(244, 183, 64, 0.3); color: var(--teamB); }
  .scoreboard { display: flex; align-items: center; justify-content: center; gap: 22px; }
  .scoreboard .lbl { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .scoreboard .lbl.a { color: var(--teamA); }
  .scoreboard .lbl.b { color: var(--teamB); }
  .scoreboard .num { font-size: 56px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .scoreboard .trail .num { color: rgba(238, 244, 248, 0.65); }
  .scoreboard .dash { font-size: 24px; color: var(--muted); }
  .progress { width: 78%; max-width: 280px; }
  .progress .segs { display: flex; gap: 3px; }
  .progress .seg { flex: 1; height: 5px; border-radius: 2px; background: #1d2b3a; }
  .progress .seg.done { background: #93a7b8; }
  .progress .seg.next { background: rgba(238, 244, 248, 0.38); }
  .progress .cap { font-size: 16px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .itl-card { background: var(--panel); border: 1px solid rgba(51, 70, 91, 0.55); border-radius: 16px; padding: 18px; }
  .itl-card .chiprow { display: flex; align-items: center; justify-content: space-between; }
  .itl-card .chip {
    background: var(--panel-2); border-radius: 999px; padding: 5px 12px; color: #c7d5e0;
    font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .itl-card .chip.gold { background: rgba(244, 183, 64, 0.14); color: var(--teamB); }
  .itl-card .meta { font-size: 17px; color: var(--muted); }
  .itl-card .vs { margin: 15px 0 5px; }
  .itl-card .vs .p { font-size: 31px; font-weight: 800; }
  .itl-card .vs .p.a { color: var(--teamA); }
  .itl-card .vs .p.b { color: var(--teamB); }
  .itl-card .vs .v { font-size: 16px; color: var(--muted); margin: 0 11px; }
  .itl-card .alloc { font-size: 17px; color: var(--muted); margin-bottom: 14px; }
  .serve-static { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; }
  .serve-static b.a { color: var(--teamA); }
  .serve-static b.b { color: var(--teamB); }
  .serve-static .why { color: var(--muted); }
  .serve-pick { display: flex; align-items: center; gap: 11px; }
  .serve-pick .lbl { font-size: 15px; color: var(--muted); white-space: nowrap; }
  .serve-pick .svc { flex: 1; display: flex; gap: 3px; background: #16202c; border: 1px solid #33465b; border-radius: 12px; padding: 3px; }
  .serve-pick .svc button {
    flex: 1; height: 50px; border: none; border-radius: 9px; background: none; cursor: pointer;
    font-size: 18px; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .serve-pick .svc button.on { font-weight: 700; }
  .serve-pick .svc button.on.a { background: rgba(15, 185, 166, 0.16); color: var(--teamA); }
  .serve-pick .svc button.on.b { background: rgba(244, 183, 64, 0.16); color: var(--teamB); }
  .itl-actions { display: flex; flex-direction: column; gap: 10px; }
  .itl-primary {
    order: -1; width: 100%; height: 56px; font-size: 20px; font-weight: 700;
    border: none; border-radius: 12px; background: var(--teamA); color: #06231f; cursor: pointer;
  }
  .itl-secondary { display: flex; gap: 10px; }
  .itl-ghost {
    flex: 1; height: 50px; font-size: 17px; font-weight: 600; cursor: pointer;
    background: none; border: 1px solid rgba(238, 244, 248, 0.28); border-radius: 10px; color: #cbd8e4;
  }
  .itl-ghost:disabled { opacity: 0.35; cursor: default; }
  .win { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 340px; }
  .win .itl-actions { width: 100%; margin-top: 10px; }
  .overlay .scoreline { font-size: 20px; color: var(--muted); }
  .overlay .scoreline b { color: var(--text); font-size: 24px; }
  .overlay .trophy { font-size: 66px; }
  .overlay .win-team { font-size: 40px; font-weight: 800; }

  /* ---------- Format picker (setup) ---------- */
  .fmt-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 560px; margin: 0 auto 18px; }
  @media (max-width: 420px) { .fmt-picker { grid-template-columns: 1fr; } }
  .fmt-opt {
    display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer;
    background: var(--panel); border: 1.5px solid #33465b; border-radius: 12px; padding: 14px 16px; color: var(--text);
  }
  .fmt-opt.on { border-color: var(--teamA); background: rgba(15, 185, 166, 0.1); }
  .fmt-opt .fmt-name { font-size: 18px; font-weight: 700; }
  .fmt-opt.on .fmt-name { color: var(--teamA); }
  .fmt-opt .fmt-blurb { font-size: 14px; color: var(--muted); line-height: 1.3; }
  .team-size { font-size: 13px; color: var(--teamB); font-weight: 600; letter-spacing: 0.3px; margin-top: 8px; }

  /* ---------- 3v4: rolling substitutions ---------- */
  .zone .subline {
    font-size: 15px; font-weight: 700; color: var(--text); margin-top: 4px;
    background: rgba(238, 244, 248, 0.12); border: 1px solid rgba(238, 244, 248, 0.2);
    border-radius: 999px; padding: 3px 13px;
  }
  .zone .subline.ghost { visibility: hidden; }
  .zone .sub-panel {
    position: absolute; inset: 0; z-index: 6; cursor: default;
    display: flex; align-items: center; justify-content: center; padding: 18px;
    background: rgba(8, 13, 19, 0.72); backdrop-filter: blur(3px);
  }
  .sub-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid rgba(244, 183, 64, 0.45);
    border-radius: 18px; padding: 24px 20px; width: 100%; max-width: 310px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    animation: subpop 0.25s ease;
  }
  @keyframes subpop { from { opacity: 0; transform: scale(0.92); } }
  .sub-card .sub-icon { font-size: 38px; }
  .sub-card .sub-who { font-size: 25px; font-weight: 800; color: var(--teamB); }
  .sub-card .sub-for { font-size: 17px; color: var(--muted); }
  .sub-card .sub-go {
    margin-top: 14px; width: 100%; height: 54px; border: none; border-radius: 12px;
    background: var(--teamB); color: #2b1f04; font-size: 20px; font-weight: 700; cursor: pointer;
  }
  .itl-card .subplan {
    display: flex; flex-direction: column; gap: 6px; margin: 0 0 14px;
    padding: 11px 13px; background: var(--panel-2); border-radius: 11px;
  }
  .subplan .sp-lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .subplan .sp-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 15px; }
  .subplan .sp-seg b { color: var(--teamB); font-weight: 700; }
  .subplan .sp-pts { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .subplan .sp-arrow { color: var(--muted); }

  /* ---------- Short viewports (phones in landscape) ---------- */
  @media (max-height: 480px) {
    .topbar { padding-top: calc(4px + env(safe-area-inset-top)); padding-bottom: 4px; }
    .topbar .round-line { display: inline; font-size: 18px; }
    .topbar .rally-line { display: inline; font-size: 16px; }
    .topbar .rally-line::before { content: ' · '; }
    .zone { gap: 4px; padding-top: 6px; padding-bottom: 6px; }
    .zone .tname { font-size: 19px; }
    .zone .serve-pill { font-size: 13px; padding: 4px 11px; letter-spacing: 1px; }
    .zone .score { font-size: clamp(44px, 32vh, 140px); }
    .zone .pname { display: none; }
    .zone .hint { position: static; font-size: 15px; }
    .tb-btn { width: 38px; height: 38px; font-size: 18px; border-radius: 9px; }
    .menu { top: calc(50px + env(safe-area-inset-top)); }
    .overlay { padding: 12px 20px; }
    .itl { display: grid; grid-template-columns: 40% 1fr; gap: 14px; max-width: 660px; align-items: center; }
    .itl-status { gap: 10px; }
    .eyebrow { font-size: 14px; padding: 6px 13px; }
    .scoreboard { gap: 18px; }
    .scoreboard .num { font-size: 42px; }
    .scoreboard .lbl { font-size: 15px; }
    .progress .cap { font-size: 14px; margin-top: 6px; }
    .itl-card { padding: 13px 15px; }
    .itl-card .vs { margin: 10px 0 3px; }
    .itl-card .vs .p { font-size: 26px; }
    .itl-card .alloc { font-size: 15px; margin-bottom: 10px; }
    .itl-card .meta { font-size: 15px; }
    .serve-static { font-size: 17px; }
    .serve-pick .svc button { height: 46px; font-size: 16px; }
    .itl > .itl-actions { grid-column: 1 / -1; display: grid; grid-template-columns: 40% 1fr; gap: 14px; }
    .itl .itl-primary { order: 1; height: 50px; font-size: 18px; }
    .itl .itl-ghost { height: 50px; font-size: 16px; }
    .overlay .trophy { font-size: 46px; }
    .overlay .win-team { font-size: 32px; }
    /* 3v4: keep the on-court / sub info visible even though it's tight */
    .zones.has-subs .zone .pname { display: block; font-size: 14px; }
    .zones.has-subs .zone .subline { font-size: 13px; padding: 2px 11px; margin-top: 3px; }
    .zone .sub-panel { padding: 10px; }
    .sub-card { padding: 12px 14px; gap: 4px; max-width: 270px; }
    .sub-card .sub-icon { font-size: 24px; }
    .sub-card .sub-who { font-size: 19px; }
    .sub-card .sub-for { font-size: 14px; }
    .sub-card .sub-go { margin-top: 7px; height: 44px; font-size: 17px; }
    .itl-card .subplan { margin-bottom: 10px; padding: 8px 11px; gap: 4px; }
    .subplan .sp-flow { font-size: 13px; gap: 6px; }
    .fmt-picker { grid-template-columns: 1fr 1fr; margin-bottom: 12px; }
    .fmt-opt { padding: 10px 13px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="./formats.js"></script>
<script>
'use strict';

/* ===== Rules ===== */
// Per-format rules live in formats.js (window.PBFormats); the active game reads
// them through fmt(). STORE_KEY is shared — a saved game records its own format.
const F = window.PBFormats;
const DEFAULT_FORMAT = '4v4';
const STORE_KEY = 'pb-4v4-state-v1';
function fmt() { return F.FORMATS[S.format] || F.FORMATS[DEFAULT_FORMAT]; }

/* ===== State ===== */
function freshState(teams, format) {
  return {
    phase: 'between',        // 'setup' | 'between' | 'play' | 'done'
    format,                  // key into PBFormats.FORMATS
    teams,                   // [{name, players:[...]}, {name, players:[...]}]
    scores: [0, 0],
    round: 0,                // 0-indexed round
    matchup: 0,              // 0-indexed lane / seed within the round
    rallies: 0,              // points played in the current lane
    server: 0,               // team serving next rally (winner of last rally)
    pendingSub: false,       // play paused for a rolling sub until the user confirms
    swapped: false,          // true = team B on the left side of the screen
    overtime: false,         // golden point at 36-36 after all rounds
    note: 'Game on!',
    hist: [],                // undo stack (past states)
    future: []               // redo stack (states undone from)
  };
}
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const st = JSON.parse(raw);
      if (st.server === undefined) st.server = 0;      // migrate pre-serve-tracking saves
      if (st.overtime === undefined) st.overtime = false;
      if (st.swapped === undefined) st.swapped = false;
      if (st.format === undefined) st.format = DEFAULT_FORMAT; // pre-format saves are 4v4
      if (st.future === undefined) st.future = [];             // pre-redo saves
      if (st.pendingSub === undefined) st.pendingSub = false;  // pre-sub-pause saves
      return st;
    }
  } catch (e) {}
  return setupState();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
}
function defaultTeams() {
  return [
    { name: '', players: ['', '', '', ''] },
    { name: '', players: ['', '', '', ''] }
  ];
}
function setupState(teams, format) {
  return { phase: 'setup', teams: teams || defaultTeams(), format: format || DEFAULT_FORMAT };
}

/* ===== Game logic ===== */
function stateSnap() {
  return JSON.stringify({
    phase: S.phase, scores: S.scores, round: S.round, matchup: S.matchup,
    rallies: S.rallies, server: S.server, overtime: S.overtime, note: S.note,
    pendingSub: S.pendingSub
  });
}

function snapshot() {
  S.hist.push(stateSnap());
  if (S.hist.length > 300) S.hist.shift();
  S.future = []; // a newly scored rally invalidates anything undone
}

function undo() {
  const prev = S.hist.pop();
  if (!prev) return;
  S.future.push(stateSnap());
  Object.assign(S, JSON.parse(prev));
  render();
}

function redo() {
  const next = S.future.pop();
  if (!next) return;
  S.hist.push(stateSnap());
  Object.assign(S, JSON.parse(next));
  render();
}

function hasWinner() {
  // Golden point: at 36-36 after all rounds, the next rally wins outright.
  return F.checkWinner(fmt(), S.scores, S.overtime);
}

function point(team) {
  if (S.phase !== 'play' || S.pendingSub) return;
  snapshot();
  S.scores[team]++;
  S.rallies++;
  S.server = team; // rally winner serves next

  if (hasWinner() !== null) {
    S.phase = 'done';
    render();
    return;
  }

  // Golden point has no rally allocation — a single rally decides it.
  if (!S.overtime && S.rallies >= fmt().laneLength[S.round]) {
    advanceMatchup();
  } else {
    // Pause play if this rally triggers a rolling substitution — the
    // announcement stays up until the user taps Continue play.
    const f = fmt();
    if (f.sub && F.onCourt(f, f.t4, S.round, S.matchup, S.rallies) !==
                 F.onCourt(f, f.t4, S.round, S.matchup, S.rallies - 1)) {
      S.pendingSub = true;
    }
  }
  render();
}

function confirmSub() {
  S.pendingSub = false;
  render();
}

// The display number of the current matchup: global (1..9) for formats that
// count across the whole match, per-round (seed) otherwise.
function unitNum(f) {
  return f.globalCount ? S.round * f.lanesPerRound + S.matchup + 1 : S.matchup + 1;
}

function advanceMatchup() {
  const f = fmt();
  const finished = unitNum(f);
  S.rallies = 0;
  S.matchup++;
  if (S.matchup >= f.lanesPerRound) {
    S.matchup = 0;
    S.round++;
  }
  if (S.round >= F.rounds(f)) {
    // All rounds done at 36-36 — the final lane's last pairing plays golden point.
    S.overtime = true;
    S.round = F.rounds(f) - 1;
    S.matchup = f.lanesPerRound - 1;
    S.rallies = f.laneLength[S.round]; // continue the final lane into sudden death
    S.note = 'All square!';
  } else {
    const base = `${f.unit} ${finished} ${f.doneWord}`;
    S.note = S.matchup === 0 ? `${base} — that wraps Round ${S.round}!` : `${base}!`;
  }
  S.phase = 'between';
}

function startGameFromSetup() {
  captureSetupInputs();
  const f = fmt();
  const teams = [0, 1].map(t => ({
    name: (S.teams[t].name || '').trim() || (t === 0 ? 'Team A' : 'Team B'),
    players: Array.from({ length: f.teamSizes[t] }, (_, p) =>
      (S.teams[t].players[p] || '').trim() || `${t === 0 ? 'A' : 'B'}${p + 1}`)
  }));
  S = freshState(teams, S.format);
  render();
}
// Snapshot whatever's currently typed into S.teams so it survives a re-render
// (switching format changes how many inputs are shown).
function captureSetupInputs() {
  for (let t = 0; t < 2; t++) {
    const nameEl = document.getElementById(`tname${t}`);
    if (nameEl) S.teams[t].name = nameEl.value;
    for (let p = 0; p < 4; p++) {
      const el = document.getElementById(`p${t}_${p}`);
      if (el) S.teams[t].players[p] = el.value;
    }
  }
}
function pickFormat(id) {
  captureSetupInputs();   // preserve typed names across the layout change
  S.format = id;
  render();
}

/* Display preference only — deliberately not snapshotted, so undo never flips sides. */
function swapSides() {
  S.swapped = !S.swapped;
  render();
}

/* Ephemeral UI state — intentionally not persisted or snapshotted. */
let menuOpen = false;
function toggleMenu() { menuOpen = !menuOpen; render(); }
function menuSwap() { menuOpen = false; swapSides(); }   // swapSides() re-renders
function menuPick(keepTeams) { menuOpen = false; render(); restart(keepTeams); }

function restart(keepTeams) {
  if (!confirm(keepTeams ? 'Restart the game with the same teams?' : 'Start over with new teams?')) return;
  S = keepTeams ? freshState(S.teams, S.format) : setupState(S.teams, DEFAULT_FORMAT);
  render();
}

/* ===== Rendering ===== */
const app = document.getElementById('app');
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BALL = s => `<svg class="ball" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#cbdc46"/><g fill="#7c8f1f"><circle cx="12" cy="7" r="1.7"/><circle cx="8" cy="11.5" r="1.7"/><circle cx="16" cy="11.5" r="1.7"/><circle cx="10" cy="16" r="1.7"/><circle cx="14.5" cy="16" r="1.7"/></g></svg>`;

function render() {
  save();
  if (S.phase === 'setup') renderSetup();
  else renderGame();
}

function renderSetup() {
  const t = S.teams;
  const f = fmt();
  const asymmetric = f.teamSizes[0] !== f.teamSizes[1];
  const picker = Object.values(F.FORMATS).map(ff => `
        <button class="fmt-opt ${ff.id === S.format ? 'on' : ''}" onclick="pickFormat('${ff.id}')">
          <span class="fmt-name">${ff.name}</span>
          <span class="fmt-blurb">${ff.blurb}</span>
        </button>`).join('');
  const card = (ti, cls, label) => {
    const size = f.teamSizes[ti];
    return `
    <div class="team-card ${cls}">
      <label>Team name</label>
      <input id="tname${ti}" placeholder="${label}" value="${esc(t[ti].name || '')}" autocomplete="off">
      ${asymmetric ? `<div class="team-size">Fields ${size} players</div>` : ''}
      ${Array.from({ length: size }, (_, p) => `
        <label>Seed ${p + 1}</label>
        <input id="p${ti}_${p}" placeholder="Player ${p + 1}" value="${esc(t[ti].players[p] || '')}" autocomplete="off">
      `).join('')}
    </div>`;
  };
  app.innerHTML = `
    <div class="setup">
      <h1><img src="./icon.svg" class="title-icon" alt=""> Pickleball Scores</h1>
      <div class="sub">Rally scoring · first to ${f.target}, win by ${f.winBy}</div>
      <div class="fmt-picker">${picker}</div>
      <div class="team-cards">
        ${card(0, 'a', 'Team A')}
        ${card(1, 'b', 'Team B')}
      </div>
      <button class="start-btn" onclick="startGameFromSetup()">Start Game</button>
      <div class="rules-note">${f.rules}</div>
    </div>`;
}

function sideOrder() { return S.swapped ? [1, 0] : [0, 1]; }

// Rolling-sub countdown for the team of 4 (3v4 only): who subs on next and
// when. '' once the player on court is the last one in this matchup.
function subLine(f, t) {
  if (f.id !== '3v4' || t !== f.t4 || S.overtime) return '';
  const ns = F.nextSub(f, S.round, S.matchup, S.rallies);
  if (!ns) return '';
  return `<div class="subline">${esc(S.teams[t].players[ns.seed])} subs ${ns.inPoints === 1 ? 'next point' : `in ${ns.inPoints}`}</div>`;
}

function zoneHTML(t) {
  const f = fmt();
  const p = S.teams[t].players[F.onCourt(f, t, S.round, S.matchup, S.rallies)];
  const sub = subLine(f, t);
  // Both columns get the same rows so the team headers line up: when only the
  // team of 4 has a sub countdown, the other side gets an invisible spacer.
  const subRow = sub || (subLine(f, 1 - t) ? '<div class="subline ghost">&nbsp;</div>' : '');
  // Blocking substitution announcement over the subbing team's side. Scoring
  // is paused (point() ignores taps) until Continue play is tapped.
  const panel = (S.pendingSub && f.sub && t === f.t4) ? `
        <div class="sub-panel">
          <div class="sub-card">
            <div class="sub-icon">🔁</div>
            <div class="sub-who">${esc(p)} subs on now</div>
            <div class="sub-for">taking over from ${esc(S.teams[t].players[F.onCourt(f, t, S.round, S.matchup, S.rallies - 1)])}</div>
            <button class="sub-go" onclick="confirmSub()">Continue play</button>
          </div>
        </div>` : '';
  return `
      <div class="zone ${t === 0 ? 'a' : 'b'}" onpointerdown="point(${t})">
        <div class="serve-pill ${S.server === t ? '' : 'hidden'}">${BALL(14)} Serving</div>
        <div class="tname">${esc(S.teams[t].name)}</div>
        <div class="score">${S.scores[t]}</div>
        <div class="pname">${esc(p)} on court</div>
        ${subRow}
        <div class="hint">tap when ${esc(p)} wins the rally</div>
        ${panel}
      </div>`;
}

function renderGame() {
  const f = fmt();
  const seed = S.matchup;
  const [L, R] = sideOrder();
  const len = f.laneLength[S.round];
  const is34 = f.id === '3v4';
  const pt = Math.min(S.rallies + 1, len);
  const roundLabel = S.overtime ? 'Golden Point' : `Round ${S.round + 1} of ${F.rounds(f)}`;
  const rallyLabel = S.overtime
    ? (is34 ? `${f.unit} ${unitNum(f)} · next rally wins it all`
            : `Seed ${seed + 1} matchup · next rally wins it all`)
    : (is34 ? `${f.unit} ${unitNum(f)} · Point ${pt} of ${len}`
            : `Seed ${seed + 1} matchup · Rally ${pt} of ${len}`);
  app.innerHTML = `
    <div class="topbar">
      <div class="tb-side">
        <button class="tb-btn" onclick="undo()" ${S.hist.length ? '' : 'disabled'} title="Undo" aria-label="Undo">↩︎</button>
        <button class="tb-btn" onclick="redo()" ${S.future.length ? '' : 'disabled'} title="Redo" aria-label="Redo">↪︎</button>
      </div>
      <div class="tb-center">
        <div class="round-line">${roundLabel}</div>
        <div class="rally-line">${rallyLabel}</div>
      </div>
      <div class="tb-side right">
        <button class="tb-btn" onclick="toggleMenu()" title="More options" aria-label="More options">⋯</button>
      </div>
    </div>
    <div class="zones${is34 ? ' has-subs' : ''}">
      ${zoneHTML(L)}
      ${zoneHTML(R)}
    </div>
    ${menuOpen ? `
    <div class="menu-backdrop" onpointerdown="toggleMenu()"></div>
    <div class="menu">
      <button onclick="menuSwap()">⇄ Swap sides</button>
      <div class="menu-sep"></div>
      <button class="danger" onclick="menuPick(true)">Restart</button>
      <button onclick="menuPick(false)">New Teams</button>
    </div>` : ''}
    ${S.phase === 'between' ? interstitial() : ''}
    ${S.phase === 'done' ? winnerOverlay() : ''}`;
}

function interstitial() {
  const f = fmt();
  const seed = S.matchup;
  const [L, R] = sideOrder();
  const cls = t => t === 0 ? 'a' : 'b';
  // The players on court for the upcoming rally (for 3v4 the team of 4 rotates,
  // so ask the schedule). Between lanes rallies is 0 (the lane's openers); in
  // the golden point rallies sits at the lane end, so this keeps the pair that
  // finished regulation rather than resetting to the lane's first server.
  const lanePlayer = t => S.teams[t].players[F.onCourt(f, t, S.round, seed, S.rallies)];
  const pL = lanePlayer(L);
  const pR = lanePlayer(R);
  const len = f.laneLength[S.round];
  const lanesPer = f.lanesPerRound;
  const done = S.round * lanesPer + S.matchup;
  const total = F.rounds(f) * lanesPer;
  const atStart = S.scores[0] + S.scores[1] === 0;
  const srv = S.server;
  const is34 = f.id === '3v4';

  const side = t => `
        <div class="${S.scores[t] < S.scores[1 - t] ? 'trail' : ''}">
          <div class="lbl ${cls(t)}">${esc(S.teams[t].name)}</div>
          <div class="num">${S.scores[t]}</div>
        </div>`;
  const progress = S.overtime ? '' : `
        <div class="progress">
          <div class="segs">${Array.from({ length: total }, (_, i) =>
            `<div class="seg ${i < done ? 'done' : i === done ? 'next' : ''}"></div>`).join('')}</div>
          <div class="cap">${f.progressWord} ${done + 1} of ${total}</div>
        </div>`;
  // Team-of-4 rotation for the upcoming lane (3v4 only).
  const plan = (is34 && !S.overtime) ? F.laneSubPlan(f, S.round, seed) : null;
  const subplan = plan ? `
          <div class="subplan">
            <span class="sp-lbl">${esc(S.teams[f.t4].name)} subs</span>
            <span class="sp-flow">${plan.map(seg => {
              const range = seg.from === seg.to ? `${seg.from}` : `${seg.from}–${seg.to}`;
              return `<span class="sp-seg"><b>${esc(S.teams[f.t4].players[seg.seed])}</b> <span class="sp-pts">${range}</span></span>`;
            }).join('<span class="sp-arrow">→</span>')}</span>
          </div>` : '';
  // Serve is only a choice before the game's first rally; afterwards the rally winner serves.
  const serveArea = atStart ? `
        <div class="serve-pick">
          <span class="lbl">First serve</span>
          <div class="svc">
            <button class="${srv === L ? `on ${cls(L)}` : ''}" onclick="S.server=${L};render()">${srv === L ? BALL(14) : ''}${esc(pL)}</button>
            <button class="${srv === R ? `on ${cls(R)}` : ''}" onclick="S.server=${R};render()">${srv === R ? BALL(14) : ''}${esc(pR)}</button>
          </div>
        </div>` : `
        <div class="serve-static">${BALL(15)}<span><b class="${cls(srv)}">${esc(lanePlayer(srv))}</b> serves first <span class="why">· won the last rally</span></span></div>`;

  return `
    <div class="overlay">
      <div class="itl">
        <div class="itl-status">
          <div class="eyebrow${S.overtime ? ' gold' : ''}">${S.overtime ? '⚡' : atStart ? BALL(13) : '✓'} ${esc(S.note)}</div>
          <div class="scoreboard">${side(L)}<div class="dash">—</div>${side(R)}</div>
          ${progress}
        </div>
        <div class="itl-card">
          <div class="chiprow">
            <span class="chip${S.overtime ? ' gold' : ''}">${S.overtime ? 'Golden point' : 'Up next'}</span>
            <span class="meta">${S.overtime ? `${f.unit} ${unitNum(f)}` : `Round ${S.round + 1} · ${f.unit} ${unitNum(f)}`}</span>
          </div>
          <div class="vs"><span class="p ${cls(L)}">${esc(pL)}</span><span class="v">vs</span><span class="p ${cls(R)}">${esc(pR)}</span></div>
          <div class="alloc">${S.overtime ? 'Sudden death — one rally wins it all' : (is34 ? `${len} points this matchup` : `${len} rallies this matchup`)}</div>
          ${subplan}
          ${serveArea}
        </div>
        <div class="itl-actions">
          <div class="itl-secondary">
            <button class="itl-ghost" onclick="swapSides()">⇄ Swap sides</button>
            <button class="itl-ghost" onclick="undo()" ${S.hist.length ? '' : 'disabled'}>↩︎ Undo rally</button>
          </div>
          <button class="itl-primary" onclick="S.phase='play';render()">${S.overtime ? 'Play golden point' : 'Start Rallies'}</button>
        </div>
      </div>
    </div>`;
}

function winnerOverlay() {
  const w = hasWinner();
  const [L, R] = sideOrder();
  return `
    <div class="overlay">
      <div class="win">
        <div class="trophy">🏆</div>
        <div class="win-team" style="color:${w === 0 ? 'var(--teamA)' : 'var(--teamB)'}">${esc(S.teams[w].name)} wins!</div>
        <div class="scoreline"><b>${S.scores[L]}</b> — <b>${S.scores[R]}</b></div>
        <div class="itl-actions">
          <div class="itl-secondary">
            <button class="itl-ghost" onclick="restart(false)">New Teams</button>
            <button class="itl-ghost" onclick="undo()">↩︎ Undo rally</button>
          </div>
          <button class="itl-primary" onclick="restart(true)">Rematch</button>
        </div>
      </div>
    </div>`;
}

/* ===== Keep screen awake during play ===== */
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});
document.addEventListener('pointerdown', keepAwake, { once: true });

/* ===== PWA ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
