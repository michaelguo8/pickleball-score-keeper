<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pickleball Score Keeper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0fb9a6"/>
      <stop offset="1" stop-color="#0a7d72"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e4d6"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- paddle -->
  <g transform="rotate(-22 256 256)">
    <rect x="150" y="92" width="150" height="220" rx="70" fill="#f4b740"/>
    <rect x="150" y="92" width="150" height="220" rx="70" fill="none" stroke="#c98a16" stroke-width="8"/>
    <rect x="205" y="300" width="40" height="92" rx="16" fill="#c98a16"/>
  </g>
  <!-- pickleball -->
  <g transform="translate(312 320)">
    <circle r="96" fill="url(#ball)" stroke="#cfc8b4" stroke-width="4"/>
    <g fill="#0a7d72" opacity="0.85">
      <circle cx="0" cy="-46" r="11"/>
      <circle cx="44" cy="-14" r="11"/>
      <circle cx="27" cy="40" r="11"/>
      <circle cx="-27" cy="40" r="11"/>
      <circle cx="-44" cy="-14" r="11"/>
      <circle cx="0" cy="6" r="11"/>
    </g>
  </g>
</svg>
