<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pickleball Score Keeper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2c40"/>
      <stop offset="1" stop-color="#0d141d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5ac8fa"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffe566"/>
      <stop offset="1" stop-color="#f2bf00"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- rally arc: 300° of the ball's flight path -->
  <path d="M 256 86 A 170 170 0 1 1 108.8 171" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"/>
  <!-- 11, the score you play to (SF outlines, weight 800) -->
  <g fill="#eef4f8">
    <path d="M206.0 327.0V215.9H205.3L169.9 239.8V210.8L205.9 186.1H239.3V327.0Z"/>
    <path d="M300.4 327.0V215.9H299.8L264.3 239.8V210.8L300.4 186.1H333.7V327.0Z"/>
  </g>
  <!-- ball at the head of the rally (kept inside the maskable safe zone) -->
  <circle cx="115.7" cy="175" r="42" fill="url(#ball)" stroke="#d9a800" stroke-width="4"/>
  <g fill="#c79000">
    <circle cx="115.7" cy="159" r="6.8"/>
    <circle cx="129.5" cy="183.6" r="6.8"/>
    <circle cx="101.1" cy="183.6" r="6.8"/>
  </g>
</svg>
